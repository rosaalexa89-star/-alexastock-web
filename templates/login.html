<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexa Stock — Ingresar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #efeae1;
    --panel: #faf7f2;
    --ink: #24303a;
    --ink-soft: #5c6670;
    --berry: #a73f55;
    --berry-dark: #7f2f41;
    --line: #ddd4c6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .tarjeta {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 34px 26px;
  }

  .marca {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--berry);
    margin: 0 0 6px;
    text-align: center;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    text-align: center;
    margin: 0 0 26px;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 5px;
    font-weight: 500;
  }

  input {
    width: 100%;
    padding: 12px 13px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: white;
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    margin-bottom: 16px;
  }

  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: var(--berry);
    color: white;
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
  }

  .error {
    background: #f4dede;
    color: var(--berry-dark);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 16px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="tarjeta">
    <p class="marca">Alexa Stock</p>
    <h1>Ingresar</h1>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label>Usuario</label>
      <input type="text" name="usuario" autocomplete="username" autofocus>

      <label>Clave</label>
      <input type="password" name="clave" autocomplete="current-password">

      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
