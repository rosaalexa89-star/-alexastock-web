databases:
  - name: alexastock-db
    plan: free
    databaseName: alexastock
    user: alexastock

services:
  - type: web
    name: alexastock
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alexastock-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
